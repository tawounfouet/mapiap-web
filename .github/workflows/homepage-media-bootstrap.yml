name: Homepage Media Bootstrap

on:
  push:
    branches:
      - feat/homepage-visual-alignment

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Download current homepage media
        run: |
          mkdir -p public/media/home
          curl --fail --location --retry 3 "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=2000&q=85" -o public/media/home/hero.jpg
          curl --fail --location --retry 3 "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1000&q=85" -o public/media/home/cabinet.jpg
          curl --fail --location --retry 3 "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=900&q=85" -o public/media/home/expertise-audit.jpg
          curl --fail --location --retry 3 "https://images.unsplash.com/photo-1529699211952-734e80c4d42b?auto=format&fit=crop&w=900&q=85" -o public/media/home/expertise-strategy.jpg
          curl --fail --location --retry 3 "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=900&q=85" -o public/media/home/expertise-transformation.jpg

      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/home
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(media): localize homepage assets"
          git push
