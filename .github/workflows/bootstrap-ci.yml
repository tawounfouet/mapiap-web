name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:run

      - name: Production release audit
        run: pnpm release:audit

      - name: Production build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E tests
        run: pnpm exec playwright test --grep-invert "homepage visual baselines"

      - name: Generate visual baselines
        run: pnpm exec playwright test tests/e2e/home-visual.spec.ts --project=chromium --update-snapshots

      - name: Commit visual baselines
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/home-visual.spec.ts-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "test(home): add visual regression baselines"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Upload visual baselines
        uses: actions/upload-artifact@v4
        with:
          name: homepage-visual-baselines
          path: tests/e2e/home-visual.spec.ts-snapshots/
          if-no-files-found: error
