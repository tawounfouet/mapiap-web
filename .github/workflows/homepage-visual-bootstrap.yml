name: Homepage Visual Bootstrap

on:
  push:
    branches:
      - feat/homepage-visual-alignment

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Refresh visual baselines
        run: pnpm exec playwright test tests/e2e/home-visual.spec.ts --project=chromium --update-snapshots

      - name: Commit visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/home-visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(home): refresh visual baselines after fidelity polish"
          git pull --rebase --autostash origin "feat/homepage-visual-alignment"
          git push origin HEAD:feat/homepage-visual-alignment
